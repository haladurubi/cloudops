
services:
  api:
    build: .
    image: cloudops-api:local

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      DATABASE_URL: sqlite:////data/cloudops.db

    volumes:
      - cloudops-data:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cloudops-data:
